<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Training</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 30px;
      }
      header h1 {
        color: #fff;
        font-size: 2rem;
        margin-bottom: 10px;
      }
      header p {
        color: rgba(255, 255, 255, 0.8);
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .question {
        font-size: 1.3rem;
        font-weight: 600;
        margin-bottom: 15px;
      }
      .situation {
        color: #667eea;
        font-size: 0.9rem;
        margin-bottom: 10px;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1rem;
        resize: vertical;
        margin-bottom: 15px;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #667eea;
      }
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
        margin: 5px;
      }
      .btn-primary {
        background: #667eea;
        color: #fff;
      }
      .btn-primary:hover {
        background: #5a6fd8;
      }
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }
      .btn-secondary:hover {
        background: #e0e0e0;
      }
      .result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        background: #f8f9fa;
      }
      .result.excellent {
        background: #d4edda;
        border: 1px solid #c3e6cb;
      }
      .result.good {
        background: #d1ecf1;
        border: 1px solid #bee5eb;
      }
      .result.poor {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
      }
      .hint {
        background: #fff3cd;
        border: 1px solid #ffeaa7;
        padding: 10px;
        border-radius: 6px;
        margin-top: 10px;
      }
      .progress {
        text-align: center;
        color: #667eea;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .controls {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
      .hidden {
        display: none !important;
      }
      .answer-reveal {
        color: #28a745;
        font-weight: 600;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🇬🇧 English Training</h1>
        <p>瞬間英作文 — Instant English Composition</p>
      </header>
      <div id="app"></div>

      <div class="card">
        <div id="progress" class="progress">Question 1 of 10</div>
        <div class="situation" id="situation"></div>
        <div class="question" id="question"></div>

        <div id="input-area">
          <textarea id="answer" placeholder="Type your 3-word answer..."></textarea>
          <div class="controls">
            <button class="btn btn-primary" id="speak-btn">🔊 Listen</button>
            <button class="btn btn-secondary" id="submit-btn">Submit</button>
            <button class="btn btn-secondary" id="reveal-btn">Reveal Answer</button>
          </div>
        </div>

        <div id="result" class="result hidden"></div>
        <div id="hint" class="hint hidden"></div>
        <div id="example" class="answer-reveal hidden"></div>

        <div class="controls" id="next-area" style="display: none">
          <button class="btn btn-primary" id="next-btn">Next Question →</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
